[project]
name = "outlook-mcp"
version = "0.1.0"
description = "MCP Server for Microsoft 365 Outlook email"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "msal>=1.28.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "html2text>=2024.2.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auth", "graph", "mail", "utils"]
